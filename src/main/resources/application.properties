spring.application.name=parivar-census


# JWT
jwt.secret=${JWT_SECRET:ThisIsMyVerySecretKeyForParivarCensusApplication2026SecureKey123456}
jwt.expiration=${JWT_EXPIRATION:86400000}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parivar_census}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Server
server.port=${PORT:8080}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

#email

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
